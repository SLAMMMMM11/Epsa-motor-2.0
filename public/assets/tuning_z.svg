<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients for realistic metallic and fiberglass finishes -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#050811" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="body-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    
    <linearGradient id="body-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
    
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.8"/>
    </linearGradient>
    
    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="tire-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <radialGradient id="headlight-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="20%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="530" rx="320" ry="40" fill="url(#shadow)"/>

  <!-- Rear Wheel (Left side/Backwards) -->
  <g id="rear-wheel-left">
    <ellipse cx="200" cy="480" rx="60" ry="60" fill="url(#tire-grad)"/>
    <ellipse cx="200" cy="480" rx="40" ry="40" fill="url(#chrome-grad)"/>
    <ellipse cx="200" cy="480" rx="25" ry="25" fill="#1e293b"/>
    <circle cx="200" cy="480" r="8" fill="#e2e8f0"/>
    <!-- Wheel bolts -->
    <circle cx="200" cy="465" r="3" fill="#cbd5e1"/>
    <circle cx="200" cy="495" r="3" fill="#cbd5e1"/>
    <circle cx="185" cy="480" r="3" fill="#cbd5e1"/>
    <circle cx="215" cy="480" r="3" fill="#cbd5e1"/>
  </g>

  <!-- Front Wheel (Sterring) -->
  <g id="front-wheel">
    <ellipse cx="640" cy="490" rx="55" ry="55" fill="url(#tire-grad)"/>
    <ellipse cx="640" cy="490" rx="35" ry="35" fill="url(#chrome-grad)"/>
    <ellipse cx="640" cy="490" rx="20" ry="20" fill="#1e293b"/>
    <circle cx="640" cy="490" r="6" fill="#e2e8f0"/>
    <!-- Suspension Fork Connection -->
    <path d="M 640 490 L 615 410" stroke="url(#chrome-grad)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 640 490 L 615 410" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Under-Chassis and Exhaust -->
  <path d="M 230 490 L 580 490 L 560 460 L 250 460 Z" fill="#1e293b"/>
  <path d="M 180 470 L 140 470 L 120 460" stroke="url(#chrome-grad)" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Fiber Glass Cabin Main Body (White) -->
  <g id="tuning-z-cabin">
    <!-- Main outer shell -->
    <path d="M 140 380 
             C 140 220, 200 120, 360 110 
             C 480 100, 600 130, 640 180 
             C 660 210, 670 260, 650 320 
             L 655 350
             C 655 380, 560 410, 560 450
             L 160 450 
             C 140 430, 140 400, 140 380 Z" 
          fill="url(#body-white)" stroke="#d4d4d8" stroke-width="3"/>
          
    <!-- Decorative side swoops and air intakes (Sport fiberglass design) -->
    <path d="M 320 430 L 480 430 L 500 390 L 340 390 Z" fill="#e4e4e7"/>
    <path d="M 330 420 L 470 420 L 485 400 L 345 400 Z" fill="#eab308" opacity="0.8"/> <!-- Yellow Racing Swoop -->
    
    <!-- Sport Side Vent / Grille (Tuning Z style geometric mesh) -->
    <path d="M 450 260 C 470 260, 480 280, 480 310 C 480 350, 440 370, 440 370 L 435 340 C 435 340, 455 320, 455 300 C 455 285, 445 280, 430 285 Z" fill="#18181b" stroke="#facc15" stroke-width="2"/>
    <path d="M 455 280 L 440 300 M 463 290 L 445 315 M 468 305 L 450 330 M 470 320 L 455 345" stroke="#facc15" stroke-width="3"/>

    <!-- Windows Frame & Glass -->
    <!-- Rear Cabin Window -->
    <path d="M 180 250 C 180 180, 220 160, 260 160 L 320 160 C 320 160, 330 200, 330 250 L 190 250 Z" fill="url(#glass)" stroke="#1e293b" stroke-width="4"/>
    <path d="M 200 185 L 310 185" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Main Passenger Window -->
    <path d="M 345 160 L 480 160 C 510 160, 520 190, 500 250 L 355 250 Z" fill="url(#glass)" stroke="#1e293b" stroke-width="4"/>
    <path d="M 370 180 L 470 180" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M 430 160 L 430 250" stroke="#1e293b" stroke-width="3"/> <!-- sliding split -->

    <!-- Door Handle -->
    <rect x="360" y="270" width="35" height="10" rx="5" fill="#18181b" stroke="#71717a" stroke-width="1"/>
    <circle cx="365" cy="275" r="2.5" fill="#cbd5e1"/>
  </g>

  <!-- Front Cabin / Windshield Structure -->
  <g id="windshield">
    <path d="M 520 150 L 610 165 C 625 170, 630 190, 615 250 L 530 250 Z" fill="url(#glass)" stroke="#1e293b" stroke-width="4"/>
    <path d="M 545 170 L 595 180" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <!-- Windshield Wiper -->
    <path d="M 515 255 L 565 200 L 595 205" stroke="#09090b" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Blue Front Nose & Hood (The Bajaj Chassis Front) -->
  <g id="front-nose-blue">
    <path d="M 535 250 
             C 550 250, 615 250, 620 255 
             C 645 280, 680 320, 685 360 
             C 690 400, 665 440, 650 450
             L 580 455
             C 560 410, 530 360, 530 270 Z" 
          fill="url(#body-blue)" stroke="#0284c7" stroke-width="1.5"/>
          
    <!-- Headlight Housing and Lamp -->
    <path d="M 640 330 C 665 330, 675 350, 670 380 C 660 405, 635 410, 625 390 Z" fill="#1e293b"/>
    <!-- Headlight Glass -->
    <path d="M 645 340 C 660 340, 665 350, 662 370 C 655 385, 640 390, 635 380 Z" fill="#fef08a" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Active Headlight Ray Glow effect (Radial Gradient overlay) -->
    <polygon points="655,365 780,310 790,440 650,385" fill="url(#headlight-glow)" style="mix-blend-mode: screen;"/>

    <!-- Front Turn Indicator (Orange LED) -->
    <path d="M 620 310 C 630 310, 635 315, 632 322 C 628 328, 618 328, 615 322 Z" fill="#f97316" stroke="#ea580c" stroke-width="1"/>

    <!-- Front Mudguard/Fender (Blue) -->
    <path d="M 590 450 C 590 415, 665 415, 675 450 L 665 470 C 640 455, 610 455, 600 470 Z" fill="url(#body-blue)"/>
  </g>

  <!-- Tuning Z Side Decal & Text branding -->
  <g id="branding">
    <!-- Blue Accent decal on White Side -->
    <path d="M 180 360 L 310 330 C 315 330, 315 340, 310 345 L 190 375 Z" fill="url(#body-blue)"/>
    <path d="M 210 390 L 290 370 C 295 370, 295 375, 290 380 L 215 398 Z" fill="url(#body-blue)"/>
    
    <!-- Branding Text "TUNING Z" -->
    <text x="210" y="320" font-family="'Inter', 'Arial', sans-serif" font-weight="900" font-style="italic" font-size="16" fill="#1e1b4b" transform="rotate(-6, 210, 320)">TUNING</text>
    <text x="285" y="318" font-family="'Inter', 'Arial', sans-serif" font-weight="700" font-style="italic" font-size="11" fill="#facc15" transform="rotate(-6, 285, 318)">Z EDITION</text>

    <!-- Model Name badge -->
    <rect x="180" y="423" width="70" height="15" rx="3" fill="#1e293b" stroke="#facc15" stroke-width="1"/>
    <text x="215" y="434" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="8" fill="#facc15" text-anchor="middle">TUNING Z</text>
  </g>

  <!-- Chrome Side Mirrors -->
  <g id="mirrors">
    <path d="M 515 210 L 485 190" stroke="url(#chrome-grad)" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="480" cy="188" rx="14" ry="8" fill="url(#chrome-grad)" stroke="#475569" stroke-width="1" transform="rotate(-20, 480, 188)"/>
    
    <path d="M 560 160 L 550 120" stroke="url(#chrome-grad)" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="548" cy="118" rx="10" ry="6" fill="url(#chrome-grad)" stroke="#475569" stroke-width="1" transform="rotate(30, 548, 118)"/>
  </g>

  <!-- Roof Ventilation Hatch / Spoiler (Tuning Z style racing vents) -->
  <path d="M 440 108 C 440 108, 470 78, 520 80 C 550 82, 560 98, 560 98 Z" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
  <ellipse cx="500" cy="94" rx="25" ry="5" fill="#facc15" transform="rotate(5, 500, 94)"/> <!-- Amber Marker Light -->
</svg>
