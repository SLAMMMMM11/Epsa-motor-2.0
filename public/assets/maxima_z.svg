<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients for realistic metallic, vinyl, and canvas fabric finishes -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#050811" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="body-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    
    <linearGradient id="canopy-tan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0c3"/>
      <stop offset="50%" stop-color="#e4c59e"/>
      <stop offset="100%" stop-color="#c69b6d"/>
    </linearGradient>

    <linearGradient id="interior-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    
    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="tire-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <radialGradient id="headlight-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="20%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="530" rx="340" ry="40" fill="url(#shadow)"/>

  <!-- Rear Wheel (Left side/Backwards) -->
  <g id="rear-wheel-left">
    <ellipse cx="200" cy="480" rx="65" ry="65" fill="url(#tire-grad)"/>
    <ellipse cx="200" cy="480" rx="42" ry="42" fill="url(#chrome-grad)"/>
    <ellipse cx="200" cy="480" rx="27" ry="27" fill="#1e293b"/>
    <circle cx="200" cy="480" r="9" fill="#e2e8f0"/>
    <!-- Wheel bolts -->
    <circle cx="200" cy="465" r="3" fill="#cbd5e1"/>
    <circle cx="200" cy="495" r="3" fill="#cbd5e1"/>
    <circle cx="185" cy="480" r="3" fill="#cbd5e1"/>
    <circle cx="215" cy="480" r="3" fill="#cbd5e1"/>
  </g>

  <!-- Front Wheel (Sterring) -->
  <g id="front-wheel">
    <ellipse cx="640" cy="490" rx="55" ry="55" fill="url(#tire-grad)"/>
    <ellipse cx="640" cy="490" rx="35" ry="35" fill="url(#chrome-grad)"/>
    <ellipse cx="640" cy="490" rx="20" ry="20" fill="#1e293b"/>
    <circle cx="640" cy="490" r="6" fill="#e2e8f0"/>
    <!-- Suspension Fork Connection -->
    <path d="M 640 490 L 615 410" stroke="url(#chrome-grad)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 640 490 L 615 410" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Under-Chassis and Engine area -->
  <path d="M 230 490 L 580 490 L 560 460 L 250 460 Z" fill="#1e293b"/>
  <!-- Exposed mechanical details / engine (Typical of open Maxima) -->
  <path d="M 330 460 L 390 460 L 370 420 L 350 420 Z" fill="#3f3f46" stroke="#18181b"/>
  <circle cx="360" cy="445" r="8" fill="url(#chrome-grad)"/>

  <!-- Exposed Inner Cabin Passenger Seating & Frames (Open-air view) -->
  <g id="inner-cabin-open">
    <!-- Back passenger seat -->
    <path d="M 160 380 L 310 380 L 310 330 L 160 330 Z" fill="url(#interior-dark)" stroke="#111827" stroke-width="2"/>
    <path d="M 160 330 C 160 300, 190 280, 240 280 L 240 330 Z" fill="#374151"/>
    <!-- Front driver seat -->
    <path d="M 440 380 L 490 380 L 490 340 L 440 340 Z" fill="url(#interior-dark)" stroke="#111827" stroke-width="1.5"/>
    
    <!-- Metal tubes and frame supports for canopy (Black metal tubes) -->
    <path d="M 155 380 L 155 180" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M 320 380 L 320 180" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M 500 380 L 500 180" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M 155 180 L 500 180" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Lower Metallic Body / Door Panel (Open Maxima has lower blue metal panel half door height) -->
  <g id="lower-metal-body">
    <path d="M 140 380 
             C 140 350, 150 330, 160 330
             L 540 330
             C 550 330, 560 350, 560 380
             L 560 450
             L 160 450 
             C 140 430, 140 400, 140 380 Z" 
          fill="url(#body-blue)" stroke="#0284c7" stroke-width="2"/>
          
    <path d="M 180 350 L 320 350 L 310 375 L 190 375 Z" fill="#ffffff" opacity="0.15"/>
    <text x="350" y="415" font-family="'Inter', sans-serif" font-weight="900" font-style="italic" font-size="28" fill="#ffffff" opacity="0.2" letter-spacing="4" text-anchor="middle">MAXIMA Z</text>
  </g>

  <!-- Front Driver Cab / Windshield & Blue Hood -->
  <g id="driver-cab-front">
    <!-- Windshield glass -->
    <path d="M 520 150 L 610 165 C 625 170, 630 190, 615 250 L 530 250 Z" fill="url(#glass)" stroke="#1e293b" stroke-width="4"/>
    <path d="M 545 170 L 595 180" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M 515 255 L 565 200 L 595 205" stroke="#09090b" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Blue Front Hood nose -->
    <path d="M 535 250 
             C 550 250, 615 250, 620 255 
             C 645 280, 680 320, 685 360 
             C 690 400, 665 440, 650 450
             L 580 455
             C 560 410, 530 360, 530 270 Z" 
          fill="url(#body-blue)" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Headlight -->
    <path d="M 640 330 C 665 330, 675 350, 670 380 C 660 405, 635 410, 625 390 Z" fill="#1e293b"/>
    <path d="M 645 340 C 660 340, 665 350, 662 370 C 655 385, 640 390, 635 380 Z" fill="#fef08a" stroke="#ffffff" stroke-width="1"/>
    <polygon points="655,365 780,310 790,440 650,385" fill="url(#headlight-glow)" style="mix-blend-mode: screen;"/>

    <!-- Mudguard -->
    <path d="M 590 450 C 590 415, 665 415, 675 450 L 665 470 C 640 455, 610 455, 600 470 Z" fill="url(#body-blue)"/>
  </g>

  <!-- Tan/Beige Canvas Canopy (Carpa de Lona) -->
  <g id="canvas-canopy">
    <!-- Main top canvas shape -->
    <path d="M 130 180 
             C 130 130, 160 100, 240 90 
             C 320 80, 480 90, 520 110 
             C 545 120, 555 140, 545 180
             C 540 210, 520 210, 520 210
             L 145 210
             C 135 210, 130 195, 130 180 Z" 
          fill="url(#canopy-tan)" stroke="#b58e63" stroke-width="2"/>
          
    <!-- Decorative side strap hooks and buckles (recreates realistic carpa texture) -->
    <circle cx="170" cy="200" r="3.5" fill="#3f3f46"/>
    <line x1="170" y1="200" x2="170" y2="215" stroke="#111827" stroke-width="2"/>
    
    <circle cx="280" cy="200" r="3.5" fill="#3f3f46"/>
    <line x1="280" y1="200" x2="280" y2="215" stroke="#111827" stroke-width="2"/>
    
    <circle cx="410" cy="200" r="3.5" fill="#3f3f46"/>
    <line x1="410" y1="200" x2="410" y2="215" stroke="#111827" stroke-width="2"/>

    <!-- Canvas folding seams / wrinkle lines (for editorial realism) -->
    <path d="M 170 140 Q 210 115, 270 120" stroke="#c69b6d" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 280 145 Q 350 110, 420 125" stroke="#c69b6d" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 400 150 Q 460 125, 510 140" stroke="#c69b6d" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 210 95 L 220 130" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M 370 88 L 380 125" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

    <!-- Rear rolled-up plastic window (Standard Peruvian detail) -->
    <rect x="180" y="145" width="100" height="40" rx="5" fill="none" stroke="#b58e63" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- Chrome Side Mirrors -->
  <g id="mirrors">
    <path d="M 515 210 L 485 190" stroke="url(#chrome-grad)" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="480" cy="188" rx="14" ry="8" fill="url(#chrome-grad)" stroke="#475569" stroke-width="1" transform="rotate(-20, 480, 188)"/>
    
    <path d="M 560 160 L 550 120" stroke="url(#chrome-grad)" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="548" cy="118" rx="10" ry="6" fill="url(#chrome-grad)" stroke="#475569" stroke-width="1" transform="rotate(30, 548, 118)"/>
  </g>
</svg>
